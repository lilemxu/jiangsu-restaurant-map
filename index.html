<link rel="stylesheet" href="leaflet.css" />
<style>

html, body { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; background: #1a1a2e; }

#app { display: flex; flex-direction: column; height: 100%; width: 100%; }

/* 工具栏 */
#toolbar {

}
#toolbar .brand-btn {
  flex: 0 0 auto; padding: 10px 18px; border-radius: 24px; border: 2px solid transparent;
  cursor: pointer; font-size: 14px; font-weight: 600; white-space: nowrap;
  transition: all 0.25s ease; color: #ccc; background: rgba(255,255,255,0.06);
  user-select: none; -webkit-tap-highlight-color: transparent;
}
#toolbar .brand-btn:hover { background: rgba(255,255,255,0.12); color: #fff; }
#toolbar .brand-btn.active { color: #fff; }
#toolbar .brand-btn[data-brand="xiongdaye"].active { background: #e63946; border-color: #ff6b6b; box-shadow: 0 0 20px rgba(230,57,70,0.5); }
#toolbar .brand-btn[data-brand="yuanji"].active { background: #2d6a4f; border-color: #52b788; box-shadow: 0 0 20px rgba(45,106,79,0.5); }
#toolbar .brand-btn[data-brand="ruyi"].active { background: #e67e00; border-color: #ffa500; box-shadow: 0 0 20px rgba(230,126,0,0.5); }
#toolbar .brand-btn[data-brand="xipiaoliang"].active { background: #6b4226; border-color: #c4956a; box-shadow: 0 0 20px rgba(107,66,38,0.5); }
#toolbar .brand-stats { font-size: 12px; color: #888; margin-left: 4px; }
#toolbar .brand-btn.active .brand-stats { color: rgba(255,255,255,0.8); }

.clear-btn {
  flex: 0 0 auto; padding: 10px 18px; border-radius: 24px; border: 2px solid rgba(255,255,255,0.15);
  cursor: pointer; font-size: 14px; font-weight: 600; white-space: nowrap;
  background: transparent; color: #888; transition: all 0.25s ease;
  user-select: none; -webkit-tap-highlight-color: transparent;
}
.clear-btn:hover { color: #fff; border-color: rgba(255,255,255,0.4); }

.layer-switch {
  margin-left: auto; display: flex; gap: 4px; background: rgba(255,255,255,0.08); border-radius: 20px; padding: 3px;
}
.layer-btn {
  padding: 6px 14px; border-radius: 18px; border: none; cursor: pointer;
  font-size: 13px; color: #aaa; background: transparent; transition: all 0.2s;
  user-select: none; -webkit-tap-highlight-color: transparent;
}
.layer-btn.active { background: rgba(255,255,255,0.2); color: #fff; }

/* 地图 */
#map-container { flex: 1; position: relative; overflow: hidden; }
#map { width: 100%; height: 100%; background: #e8e8e8; }

/* 缩放按钮 */
.zoom-controls {
  position: absolute; right: 16px; bottom: 60px; display: flex; flex-direction: column; gap: 2px; z-index: 500;
}
.zoom-btn {

  user-select: none; -webkit-tap-highlight-color: transparent;
}
.zoom-btn:active { background: #eee; }

/* 闪烁标记 */
.blink-dot {
  width: 18px; height: 18px; border-radius: 50%; position: relative;
  animation: blink 1.2s ease-in-out infinite; cursor: pointer;
}
.blink-dot::after {
  content: ''; position: absolute; top: -6px; left: -6px; right: -6px; bottom: -6px;
  border-radius: 50%; animation: pulse-ring 1.2s ease-in-out infinite;
}
.blink-dot.red { background: #e63946; box-shadow: 0 0 10px rgba(230,57,70,0.9); }
.blink-dot.red::after { border: 2px solid rgba(230,57,70,0.5); }
.blink-dot.green { background: #2d6a4f; box-shadow: 0 0 10px rgba(45,106,79,0.9); }
.blink-dot.green::after { border: 2px solid rgba(45,106,79,0.5); }
.blink-dot.orange { background: #ff8c00; box-shadow: 0 0 10px rgba(255,140,0,0.9); }
.blink-dot.orange::after { border: 2px solid rgba(255,140,0,0.5); }
.blink-dot.brown { background: #8b5e3c; box-shadow: 0 0 10px rgba(139,94,60,0.9); }
.blink-dot.brown::after { border: 2px solid rgba(139,94,60,0.5); }

@keyframes blink {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.35; transform: scale(1.4); }
}
@keyframes pulse-ring {
  0%, 100% { opacity: 0.4; transform: scale(1); }
  50% { opacity: 0; transform: scale(2.2); }
}

/* 弹窗 */
.leaflet-popup-content-wrapper {
  border-radius: 10px !important; background: rgba(0,0,0,0.88) !important; color: #fff !important;

.leaflet-popup-content { margin: 10px 14px !important; font-size: 13px; line-height: 1.6; }
.leaflet-popup-content .pn { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
.leaflet-popup-content .pd { color: #aaa; font-size: 12px; }
.leaflet-popup-content .pa { color: #999; font-size: 11px; margin-top: 4px; }
.leaflet-popup-tip { background: rgba(0,0,0,0.88) !important; }

/* 加载 */
#loading {

// ==================== 渲染标记 ====================
function createBlinkIcon(color) {
  return L.divIcon({
    className: '',
    html: `<div class="blink-dot ${color}"></div>`,
    iconSize: [18, 18],
    iconAnchor: [9, 9],
    popupAnchor: [0, -9]
  });
}

function renderBrandMarkers(brandKey) {
  if (!allPoiData[brandKey] || allPoiData[brandKey].length === 0) return;

  const pois = allPoiData[brandKey];
  const brand = BRANDS[brandKey];
  const layerGroup = L.layerGroup();

  for (const poi of pois) {
    const [lng, lat] = poi.location.split(',').map(Number);
    if (isNaN(lng) || isNaN(lat)) continue;

    const marker = L.marker([lat, lng], {
      icon: createBlinkIcon(brand.color),
      zIndexOffset: 100
    });

    // 弹窗内容
    const popupContent = `
      <div class="pn">${poi.name || '未知门店'}</div>
      <div class="pd">${poi.city || ''} · ${poi.address || ''}</div>
      <div class="pa">${poi.biz_ext && poi.biz_ext.rating ? '⭐' + poi.biz_ext.rating : ''}${poi.biz_ext && poi.biz_ext.cost ? ' · 人均 ¥' + poi.biz_ext.cost : ''}${poi.tel ? ' · 📞' + poi.tel : ''}</div>
    `;

    marker.bindPopup(popupContent, { offset: [0, -10], closeButton: false });

    // PC 悬浮弹出
    marker.on('mouseover', function() { this.openPopup(); });
    marker.on('mouseout', function() {
      if (popupTarget !== this) this.closePopup();
    });
    // 触屏点击切换
    marker.on('click', function() {
      if (popupTarget === this) {
        this.closePopup();
        popupTarget = null;
      } else {
        if (popupTarget) popupTarget.closePopup();
        this.openPopup();
        popupTarget = this;
      }
    });

    layerGroup.addLayer(marker);
  }

  layerGroup.addTo(map);
  brandLayerGroups[brandKey] = layerGroup;
}

function hideBrandMarkers(brandKey) {
  if (brandLayerGroups[brandKey]) {
    map.removeLayer(brandLayerGroups[brandKey]);
    brandLayerGroups[brandKey] = null;
  }
}

// ==================== 品牌切换 ====================
function toggleBrand(brandKey) {
  if (activeBrands.has(brandKey)) {
    activeBrands.delete(brandKey);
    hideBrandMarkers(brandKey);
    document.querySelector(`.brand-btn[data-brand="${brandKey}"]`).classList.remove('active');
  } else {
    activeBrands.add(brandKey);
    if (!brandLayerGroups[brandKey]) {
      renderBrandMarkers(brandKey);
    }
    document.querySelector(`.brand-btn[data-brand="${brandKey}"]`).classList.add('active');
  }
}

function clearAll() {
  for (const key of activeBrands) hideBrandMarkers(key);
  activeBrands.clear();
  document.querySelectorAll('.brand-btn').forEach(b => b.classList.remove('active'));
  if (popupTarget) { popupTarget.closePopup(); popupTarget = null; }
}

// ==================== 图层切换 ====================
function switchLayer(type) {
  if (type === 'satellite') {
    map.removeLayer(standardLayer);
    map.addLayer(satelliteLayer);
  } else {
    map.removeLayer(satelliteLayer);
    map.addLayer(standardLayer);
  }
  currentLayer = type;
  document.querySelectorAll('.layer-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`.layer-btn[onclick*="'${type}'"]`)?.classList.add('active');
}

// ==================== 工具函数 ====================
function updateStats() {
  for (const key of Object.keys(BRANDS)) {
    const el = document.getElementById(`stat-${key}`);
    if (!el) continue;
    const count = allPoiData[key] ? allPoiData[key].length : 0;
    el.textContent = count > 0 ? `${count}家` : '';
  }
}

function showLoading(show, text = '加载中...') {
  const el = $('loading');
  const t = $('loading-text');
  if (!el) return;
  t.textContent = text;
  el.classList.toggle('show', show);
}

// ==================== 启动 ====================
init().catch(err => {
  console.error('初始化失败:', err);
  showLoading(true, '错误: ' + err.message);
  $('loading').querySelector('.spinner').style.display = 'none';
});
</script>
</body>
</html>
